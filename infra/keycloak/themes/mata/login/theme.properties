# Thème de login MATA — rebrand de la page Keycloak hébergée (Lot 9).
#
# Hérite du thème `keycloak` (donc PatternFly + css/login.css de base via
# `stylesCommon`/`styles` parents) et ajoute `css/mata.css` EN DERNIER pour
# surcharger couleurs/typo/logo aux tokens MATA (palette `mata`, rouge boeuf
# #9b1c1c). On ne touche pas aux templates FTL : flux OIDC + PKCE inchangé,
# Keycloak reste l'unique fournisseur d'auth (CLAUDE.md §C / §G8).
parent=keycloak
import=common/keycloak
styles=css/login.css css/mata.css
