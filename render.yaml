# Render Blueprint · MATA Plateforme
#
# Référence : ARCHITECTURE.md §11 « CI/CD et opérations ».
# Procédure d'application : voir docs/DEPLOYMENT.md.
#
# Services :
#   - mata-api          (web service, Fastify)
#   - mata-web          (web service, Next.js)
#   - mata-keycloak     (web service, Keycloak)
#   - mata-db           (postgres, applicatif)
#   - mata-keycloak-db  (postgres, Keycloak)
#
# Coût estimé : 6 services Starter (~42 $/mois) + n8n optionnel.

databases:
  - name: mata-db
    plan: starter
    databaseName: mata
    user: mata
    postgresMajorVersion: '18'

  - name: mata-keycloak-db
    plan: starter
    databaseName: keycloak
    user: keycloak
    postgresMajorVersion: '18'

services:
  # ────────────────────────────────────────────────────────────
  # mata-api · Fastify
  # ────────────────────────────────────────────────────────────
  - type: web
    name: mata-api
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    rootDir: .
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    preDeployCommand: cd /app && npx prisma migrate deploy
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: mata-db
          property: connectionString
      - key: PUBLIC_WEB_URL
        sync: false
      - key: KEYCLOAK_URL
        sync: false
      - key: KEYCLOAK_REALM
        value: mata
      - key: KEYCLOAK_CLIENT_API_AUDIENCE
        value: mata-api
      - key: BICTORYS_API_KEY
        sync: false
      - key: BICTORYS_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: HCAPTCHA_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ────────────────────────────────────────────────────────────
  # mata-web · Next.js (PWA)
  # ────────────────────────────────────────────────────────────
  - type: web
    name: mata-web
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    rootDir: .
    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: mata-api
          property: hostport
      - key: NEXT_PUBLIC_KEYCLOAK_URL
        sync: false
      - key: NEXT_PUBLIC_KEYCLOAK_REALM
        value: mata
      - key: NEXT_PUBLIC_KEYCLOAK_CLIENT_ID
        value: mata-web
      # Sitekey hCaptcha PUBLIQUE (guest checkout, Lot 8). Pendant front de
      # HCAPTCHA_SECRET (mata-api). Vide → widget masqué (checkout non gardé).
      - key: NEXT_PUBLIC_HCAPTCHA_SITEKEY
        sync: false

  # ────────────────────────────────────────────────────────────
  # mata-keycloak · SSO
  # ────────────────────────────────────────────────────────────
  - type: web
    name: mata-keycloak
    runtime: image
    image:
      url: quay.io/keycloak/keycloak:26.0
    plan: starter
    region: frankfurt
    healthCheckPath: /health/ready
    dockerCommand: start --optimized --hostname-strict=false
    envVars:
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL
        fromDatabase:
          name: mata-keycloak-db
          property: connectionString
      - key: KC_HOSTNAME_STRICT
        value: 'false'
      - key: KC_HTTP_ENABLED
        value: 'true'
      - key: KC_HEALTH_ENABLED
        value: 'true'
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  # ────────────────────────────────────────────────────────────
  # Cron Jobs · partagent l'image Docker de mata-api (api.Dockerfile).
  #
  # Override du CMD via `dockerCommand`. On invoque le JS COMPILÉ
  # (`node dist/jobs/<job>.js`) et NON `pnpm <job>:cron` : l'image runtime
  # est produite par `pnpm --prod deploy` (sans devDeps → pas de `tsx`) et
  # ne copie que `dist/` + `prisma/` (pas les sources TS). Les scripts
  # `*:cron` du package.json (`tsx src/jobs/...`) restent pour le dev local.
  #
  # CRON_DISABLED=true sur un job le met en pause sans le supprimer.
  # ────────────────────────────────────────────────────────────

  # retry-outbox · délivre les outbox_events vers n8n (toutes les minutes)
  - type: cron
    name: mata-cron-retry-outbox
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    rootDir: .
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    schedule: '*/1 * * * *'
    dockerCommand: node dist/jobs/retry-outbox.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: mata-db
          property: connectionString
      - key: N8N_BASE_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false

  # process-payouts · agrège les items livrés, déclenche les reversements (6h UTC)
  - type: cron
    name: mata-cron-process-payouts
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    rootDir: .
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    schedule: '0 6 * * *'
    dockerCommand: node dist/jobs/process-payouts.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: mata-db
          property: connectionString
      - key: BICTORYS_API_KEY
        sync: false
      - key: BICTORYS_API_SECRET
        sync: false
      - key: BICTORYS_API_BASE_URL
        sync: false
      # Optionnel : force l'acteur audit du cron. Vide → premier admin actif.
      - key: CRON_ACTOR_USER_ID
        sync: false

  # cleanup-teleconsult · ferme sessions expirées + purge codes (toutes les 5 min)
  - type: cron
    name: mata-cron-cleanup-teleconsult
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    rootDir: .
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    schedule: '*/5 * * * *'
    dockerCommand: node dist/jobs/cleanup-expired-teleconsult.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: mata-db
          property: connectionString

  # cleanup-idempotency · purge les idempotency_records > 24h (3h UTC)
  - type: cron
    name: mata-cron-cleanup-idempotency
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    rootDir: .
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    schedule: '0 3 * * *'
    dockerCommand: node dist/jobs/cleanup-idempotency.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: mata-db
          property: connectionString
