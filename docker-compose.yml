# Docker Compose · dev local MATA
#
# Lance Postgres, Keycloak, et Mailhog uniquement. L'API et le Web
# tournent en `pnpm dev` natif (hot reload, plus rapide qu'en conteneur).
#
# Usage :
#   docker compose up -d         # démarrage en arrière-plan
#   docker compose logs -f       # suivre les logs
#   docker compose down          # arrêt (préserve les volumes)
#   docker compose down -v       # arrêt + reset complet des données

name: mata-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: mata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mata
      POSTGRES_PASSWORD: mata
      POSTGRES_DB: mata
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mata -d mata']
      interval: 5s
      timeout: 5s
      retries: 10

  # Postgres séparé pour Keycloak (cf. ARCHITECTURE.md §2)
  keycloak-db:
    image: postgres:18-alpine
    container_name: mata-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: mata-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
    ports:
      # Port hôte 8081 (8080 squatté par EnterpriseDB/Apache local sur cette
      # machine dev). Le container expose toujours 8080 en interne. Si tu
      # n'as pas EDB, repasse à 8080:8080 — il faudra aligner les env vars
      # KEYCLOAK_URL côté apps/api/.env et apps/web/.env.local.
      - '8081:8080'
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mata-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # UI web

  # n8n (Lot 7) — destination réelle du dispatch outbox (cron retry-outbox).
  # Le cron POST chaque event vers http://localhost:5678/webhook/<eventType>
  # signé HMAC SHA-256 (X-Mata-Signature). DB SQLite embarquée (suffisant en
  # dev). UI sur http://localhost:5678 (créer un owner au 1er lancement).
  n8n:
    image: n8nio/n8n:latest
    container_name: mata-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      # URL de base utilisée pour générer les URLs de webhook (production mode).
      WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      # Cookie non-secure : login UI possible en HTTP sur localhost.
      N8N_SECURE_COOKIE: 'false'
      GENERIC_TIMEZONE: Africa/Dakar
      # Clé de chiffrement des credentials n8n (dev fixe → persistance volume).
      N8N_ENCRYPTION_KEY: mata-dev-n8n-encryption-key-change-me
      # Évite les warnings de dépréciation au boot.
      N8N_RUNNERS_ENABLED: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
    ports:
      - '5678:5678'
    volumes:
      - n8n-data:/home/node/.n8n
      # Workflows MATA prêts à importer (cf. infra/n8n/README).
      - ./infra/n8n:/import:ro

volumes:
  postgres-data:
  keycloak-db-data:
  n8n-data:
