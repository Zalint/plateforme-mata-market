<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MATA · Hors ligne</title>
  <style>
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:#fafaf9;color:#1c1917;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
    .card{max-width:420px;text-align:center;}
    .badge{width:64px;height:64px;border-radius:16px;background:#9b1c1c;color:white;display:inline-flex;align-items:center;justify-content:center;font-weight:800;}
    h1{font-size:24px;margin:16px 0 8px;}
    p{color:#57534e;line-height:1.5;}
    button{margin-top:24px;padding:12px 20px;border-radius:12px;background:#9b1c1c;color:white;border:0;font-weight:600;cursor:pointer;}
    button:hover{background:#7f1d1d;}
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">MA</div>
    <h1>Pas de connexion</h1>
    <p>L'application MATA a besoin d'une connexion internet pour fonctionner. Vérifiez votre réseau et réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
