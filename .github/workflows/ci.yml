name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · typecheck · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm biome ci .

      - name: Prisma generate
        run: pnpm --filter @mata/api exec prisma generate

      - name: Build shared package
        run: pnpm --filter @mata/shared build

      - name: Build UI package
        run: pnpm --filter @mata/ui build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build all
        run: pnpm build

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci

    env:
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: mata
      KEYCLOAK_CLIENT_ID: mata-web
      KEYCLOAK_REDIRECT_URI: http://localhost:3000/api/auth/callback
      API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: mata
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: mata-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate + build packages
        run: |
          pnpm --filter @mata/api exec prisma generate
          pnpm --filter @mata/shared build
          pnpm --filter @mata/ui build

      - name: Build web
        run: pnpm --filter @mata/web build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke E2E
        working-directory: apps/web
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
